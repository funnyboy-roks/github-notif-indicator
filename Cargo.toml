[package]
name = "github-notif-indicator"
version = "0.1.0"
edition = "2024"

[dependencies]
forgejo-api = { version = "0.11.1", features = ["rustls-tls"] }
futures-util = "0.3.33"
octocrab = { version = "0.49.5", default-features = false, features = ["rustls-aws-lc-rs", "default-client", "follow-redirect", "jwt-rust-crypto", "retry", "rustls", "timeout", "tracing", "stream"] }
tokio = { version = "1.49.0", features = ["macros", "rt"] }
url = "2.5.8"
